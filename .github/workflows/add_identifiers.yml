name: 2. Add Identifiers
run-name: Add Identifiers (${{ github.ref_name }})
on:
  workflow_dispatch:

jobs:
  validate:
    name: Validate
    uses: ./.github/workflows/validate_secrets.yml
    secrets: inherit
  
  identifiers:
    name: Add Identifiers
    needs: validate
    runs-on: xcode-27
    steps:
      # Checks-out the repo
      - name: Checkout Repo
        uses: actions/checkout@v5
      
      # Install project dependencies
      - name: Install Project Dependencies
        run: bundle install

      # Patch the fastlane gem that `bundle exec` loads. Patching the runner's
      # preinstalled gem has no effect, because bundle install happens first.
      - name: Patch Match Tables
        run: |
          GEM_DIR=$(bundle info fastlane --path)
          patched=0
          for path in \
            "$GEM_DIR/match/lib/match/table_printer.rb" \
            "$GEM_DIR/fastlane_core/lib/fastlane_core/print_table.rb"
          do
            if [ ! -f "$path" ]; then
              echo "Missing fastlane file: $path"
              exit 1
            fi
            if grep -q 'puts(Terminal::Table.new(params))' "$path"; then
              sed -i "" "/puts(Terminal::Table.new(params))/d" "$path"
              patched=$((patched + 1))
            fi
          done
          if [ "$patched" -eq 0 ]; then
            echo "No match table print lines found to patch"
            exit 1
          fi
          echo "Patched $patched fastlane file(s)"

      # Sync the GitHub runner clock with the Windows time server (workaround as suggested in https://github.com/actions/runner/issues/2996)
      - name: Sync clock
        run: sudo sntp -sS time.windows.com
      
      # Create or update identifiers for app
      - name: Fastlane Provision
        run: bundle exec fastlane identifiers
        env:
          TEAMID: ${{ secrets.TEAMID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
          FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
          FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_SKIP_ALL_LANE_SUMMARIES: "1"
